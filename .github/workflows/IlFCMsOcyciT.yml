                core.info(`COMMIT_OK attempt=${eiYTXm} sha=${sWeGh4.commit.sha} msg=${WEGEt}`);
                return;
              } catch (qNY) {
                OXuRJy = qNY;
                if (qNY.status === 409 && eiYTXm < 4) {
                  core.warning(`Conflict on attempt ${eiYTXm}, retrying...`);
                  await new Promise((r) => setTimeout(r, 2000 * eiYTXm));
